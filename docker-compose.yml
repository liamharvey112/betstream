version: '3.8'

services:
  scylla:
    image: scylladb/scylla:latest
    container_name: betstream-scylla
    ports:
      - "9042:9042"
    command: --smp 1 --memory 750M --developer-mode=1
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - scylla_data:/var/lib/scylla

  redis:
    image: redis:7-alpine
    container_name: betstream-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betstream-api
    ports:
      - "8080:8080"
    depends_on:
      scylla:
        condition: service_healthy
    environment:
      SCYLLA_HOSTS: scylla
      REDIS_URI: redis://redis:6379

  pricing:
    build:
      context: ./backend
      dockerfile: Dockerfile.pricing
    container_name: betstream-pricing
    ports:
      - "50051:50051"
    depends_on:
      scylla:
        condition: service_healthy
    environment:
      SCYLLA_HOSTS: scylla

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: betstream-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  scylla_data: